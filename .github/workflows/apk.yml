name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main, master]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "resources/**"
      - "tools/patch-android.js"
      - "www/sw.js"
      - "www/ota-config.js"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Kiểm tra khóa ký
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Thiếu secret KEYSTORE_BASE64 hoặc KEYSTORE_PASSWORD (xem README, mục 2)"; exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/aftershot.keystore"

      - name: Điền kho GitHub vào cấu hình cập nhật
        run: |
          sed -i 's#OWNER/REPO#${{ github.repository }}#' www/ota-config.js
          sed -i 's#branch: "main"#branch: "${{ github.event.repository.default_branch }}"#' www/ota-config.js
          cat www/ota-config.js

      - run: npm install

      - name: Tạo version.json
        run: node tools/make-version.js

      - name: Tạo dự án Android
        run: |
          npx cap add android
          VER=$(node -p "require('./www/version.json').v")
          echo "VER=$VER" >> "$GITHUB_ENV"
          VERSION_NAME="$VER" VERSION_CODE="${{ github.run_number }}" BUILD_VERSION="$VER" node tools/patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/aftershot.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: aftershot
        run: ./gradlew assembleRelease --no-daemon

      - name: Đặt tên file APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -n "$APK"
          cp "$APK" "AfterShot-$VER.apk"
          cp "$APK" AfterShot.apk
          echo "APK=AfterShot-$VER.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: AfterShot-apk
          path: ${{ env.APK }}

      - name: Phát hành (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$VER"
          gh release create "$TAG" "$APK" AfterShot.apk --title "AfterShot $VER" --notes "Bản cài Android. Sau khi cài, các thay đổi giao diện/bộ màu cập nhật ngay trong app." --latest || gh release upload "$TAG" "$APK" AfterShot.apk --clobber
